kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ── 发布坐标 (单一事实源) ──
# JitPack 发布时以 git tag 覆盖 version; 本地/自定义发布可改此处。
# group 用 com.github.<用户名> 标准形式 — JitPack 的坐标映射规则是
# `com.github.<用户>:<仓库名>:<tag>`, 不要写成 com.github.User.Repo (实测不可解析)。
harness.group=com.github.WowBlueStudio
harness.version=0.1.1
